name: Windows MSVC Release
on:
  push:
    tags:
      - "*"

jobs:
  build_and_release:
    strategy:
      matrix:
        include:
          # 64-bit build
          - name: win64_msvc
            os: windows-2022
            build_type: Release
            msvc_arch: x64
            qt_arch: win64_msvc2019_64
            qt_version: 5.15.2
            qt_target: desktop
          # 32-bit build
          - name: win32_msvc
            os: windows-2022
            build_type: Release
            msvc_arch: x86
            qt_arch: win32_msvc2019_64
            qt_version: 5.15.2
            qt_target: desktop
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      QT_VERSION: ${{ matrix.qt_version }}
      COO_PROJECT: dde-cooperation
      DT_PROJECT: data-transfer
      # OpenSSL paths based on architecture
      OPENSSL_ROOT_DIR: ${{ matrix.msvc_arch == 'x64' && 'C:\Program Files\OpenSSL' || 'C:\Program Files (x86)\OpenSSL' }}
    steps:
      - name: "⚙️ Cache Qt"
        id: cache-qt
        uses: actions/cache@v3
        with:
          path: ..\Qt
          key: Windows-QtCache-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}

      - name: Install Qt ${{ env.QT_VERSION }} ${{ matrix.qt_arch }}
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: "==3.1.*"
          version: ${{ env.QT_VERSION }}
          target: ${{ matrix.qt_target }}
          arch: ${{ matrix.qt_arch }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      - name: Setup cmake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.5
          ninjaVersion: 1.11.1

      - name: Setup WiX Toolset
        run: |
          echo "Installing WiX Toolset..."
          winget install WiX.Toolset --accept-source-agreements --accept-package-agreements
          echo "Verifying WiX installation..."
          wix --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: msvc-build
        shell: cmd
        env:
          vc_arch: ${{ matrix.msvc_arch }}
          cmake_gen: Visual Studio 17 2022
          APP_VERSION: ${{ github.ref_name }}
        run: |
          REM Use Visual Studio 2022 Enterprise
          set "VS2022_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          call "%VS2022_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %vc_arch%

          echo ============== Build Configuration ==============
          echo Architecture: %vc_arch%
          echo OpenSSL: %OPENSSL_ROOT_DIR%
          echo App Version: %APP_VERSION%
          echo ================================================

          mkdir build && cd build

          echo ------------CMake Configuration------------
          cmake -G "%cmake_gen%" -A %vc_arch% ^
            -D CMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -D CMAKE_PREFIX_PATH="%Qt5_DIR%" ^
            -D QT_VERSION=%QT_VERSION% ^
            -D APP_VERSION=%APP_VERSION% ^
            -D ENABLE_WIX=ON ^
            "%GITHUB_WORKSPACE%\source"
          if ERRORLEVEL 1 exit /b 1

          echo ------------Build Project------------
          cmake --build . --config %BUILD_TYPE%
          if ERRORLEVEL 1 exit /b 1

          echo ------------Copy Dependencies------------
          if exist output\%BUILD_TYPE% (
              if "%vc_arch%"=="x64" (
                  copy "%OPENSSL_ROOT_DIR%\bin\libcrypto-3-x64.dll" output\%COO_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libssl-3-x64.dll" output\%COO_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libcrypto-3-x64.dll" output\%DT_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libssl-3-x64.dll" output\%DT_PROJECT%\%BUILD_TYPE%\ > NUL
              ) else (
                  copy "%OPENSSL_ROOT_DIR%\bin\libcrypto-3-x86.dll" output\%COO_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libssl-3-x86.dll" output\%COO_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libcrypto-3-x86.dll" output\%DT_PROJECT%\%BUILD_TYPE%\ > NUL
                  copy "%OPENSSL_ROOT_DIR%\bin\libssl-3-x86.dll" output\%DT_PROJECT%\%BUILD_TYPE%\ > NUL
              )
          )

          echo ------------Build MSI Packages with WiX ------------
          mkdir _CPack_Packages
          
          REM Package dde-cooperation
          echo.
          echo Packaging %COO_PROJECT%...
          mkdir wix-temp-coop
          xcopy /E /I /Y output\%BUILD_TYPE%\%COO_PROJECT%\* wix-temp-coop\ > NUL
          
          if exist output\%COO_PROJECT%.wxs (
              call :prepare_wxs output\%COO_PROJECT%.wxs wix-temp-coop %COO_PROJECT% %APP_VERSION% %vc_arch%
              if ERRORLEVEL 1 exit /b 1
              
              cd wix-temp-coop
              wix build main.wxs ^
                -loc "%GITHUB_WORKSPACE%\source\dist\wix\scripts\lang\dde-cooperation-en.wxl" ^
                -loc "%GITHUB_WORKSPACE%\source\dist\wix\scripts\lang\dde-cooperation-chs.wxl" ^
                -out ..\_CPack_Packages\%COO_PROJECT%-%APP_VERSION%-win-%vc_arch%.msi
              if ERRORLEVEL 1 exit /b 1
              cd ..
              rmdir /q /s wix-temp-coop
              echo %COO_PROJECT% MSI created successfully!
          ) else (
              echo Warning: %COO_PROJECT%.wxs not found, skipping WiX packaging
          )
          
          REM Package data-transfer
          echo.
          echo Packaging %DT_PROJECT%...
          mkdir wix-temp-dt
          xcopy /E /I /Y output\%BUILD_TYPE%\%DT_PROJECT%\* wix-temp-dt\ > NUL
          
          if exist output\%DT_PROJECT%.wxs (
              call :prepare_wxs output\%DT_PROJECT%.wxs wix-temp-dt deepin-%DT_PROJECT% %APP_VERSION% %vc_arch%
              if ERRORLEVEL 1 exit /b 1
              
              cd wix-temp-dt
              wix build main.wxs ^
                -loc "%GITHUB_WORKSPACE%\source\dist\wix\scripts\lang\data-transfer-en.wxl" ^
                -loc "%GITHUB_WORKSPACE%\source\dist\wix\scripts\lang\data-transfer-chs.wxl" ^
                -out ..\_CPack_Packages\deepin-%DT_PROJECT%-%APP_VERSION%-win-%vc_arch%.msi
              if ERRORLEVEL 1 exit /b 1
              cd ..
              rmdir /q /s wix-temp-dt
              echo deepin-%DT_PROJECT% MSI created successfully!
          ) else (
              echo Warning: %DT_PROJECT%.wxs not found, skipping WiX packaging
          )
          
          echo.
          echo ========================================
          echo WiX packaging completed!
          echo ========================================
          
          REM ========== Inno Setup (Alternative, Commented Out) ==========
          REM If you prefer Inno Setup, uncomment the following lines:
          REM
          REM echo ------------Build EXE Packages with Inno Setup------------
          REM set "INNO_ROOT=C:\Program Files (x86)\Inno Setup 6"
          REM "%INNO_ROOT%\ISCC.exe" /Qp %COO_PROJECT%-setup.iss
          REM move %cd%\installer-inno\deepin-cooperation-* %cd%\installer-inno\%COO_PROJECT%\ > NUL
          REM "%INNO_ROOT%\ISCC.exe" /Qp deepin-%DT_PROJECT%-setup.iss
          REM move %cd%\installer-inno\deepin-datatransfer-* %cd%\installer-inno\%DT_PROJECT%\ > NUL
          REM ==================================================================
          
          goto :eof
          
          REM ========================================
          REM Subroutine: Prepare wxs file with actual paths
          REM ========================================
          :prepare_wxs
          set TEMPLATE_WXS=%~1
          set TEMP_DIR=%~2
          set EXE_NAME=%~3
          set VERSION=%~4
          set ARCH=%~5
          
          REM Determine install directory based on architecture
          if /i "%ARCH%"=="x64" (
              set PROG_FILES=ProgramFiles64Folder
          ) else (
              set PROG_FILES=ProgramFilesFolder
          )
          
          REM Read template and replace variables using PowerShell
          powershell -Command "& { $content = Get-Content '%TEMPLATE_WXS%' -Raw; $content = $content -replace '@PRODUCT_VERSION@', '%VERSION%'; $content = $content -replace '@PROGRAM_FILES_FOLDER@', '%PROG_FILES%'; $content = $content -replace '@EXE_FILE@', '%TEMP_DIR%\%EXE_NAME%.exe'; $content = $content -replace '@EXE_NAME@', '%EXE_NAME%.exe'; $content = $content -replace '@INCLUDE_TRANSLATIONS@', ''; $content | Out-File -FilePath '%TEMP_DIR%\main.wxs' -Encoding UTF8 }"
          if ERRORLEVEL 1 exit /b 1
          
          exit /b 0

      - name: Make Installer Archives
        run: |
          # Archive all MSI installers
          if exist "build/_CPack_Packages" {
            New-Item -ItemType Directory -Force -Path build/installers
            Get-ChildItem -Path build/_CPack_Packages -Recurse -Filter *.msi | ForEach-Object {
              $dest = "build/installers/$($_.Name)"
              Move-Item $_.FullName -Destination $dest -Force
            }
            Compress-Archive -Path build/installers/* -DestinationPath build/installers-${{ matrix.msvc_arch }}.zip
          }
          
          # Legacy: Also archive any 7z files if they exist
          if (Test-Path "build/*.7z") {
            Get-ChildItem -Path build -Filter *.7z | ForEach-Object {
              Write-Host "Found legacy 7z file: $($_.Name)"
            }
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ matrix.msvc_arch }}
          path: |
            build/*.zip
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build/*.zip
          generate_release_notes: true
          draft: true
