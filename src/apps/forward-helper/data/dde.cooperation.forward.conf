<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the subnet-forward helper name. -->
  <policy user="root">
    <allow own="dde.cooperation.forward"/>
  </policy>
  <!-- Any local user may talk to the helper; per-action authorization is
       enforced by polkit inside the helper. -->
  <policy context="default">
    <allow send_destination="dde.cooperation.forward"/>
  </policy>
</busconfig>
