syntax = "proto3";

package benchmark;

service BenchmarkService {
  rpc EchoMessage (EchoRequest) returns (EchoResponse);
  rpc Add (AddRequest) returns (AddResponse);
  rpc VoidMethod (VoidRequest) returns (VoidResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string result = 1;
}

message AddRequest {
  int32 a = 1;
  int32 b = 2;
}

message AddResponse {
  int32 result = 1;
}

message VoidRequest {
}

message VoidResponse {
} 